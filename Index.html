<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificador TF.js</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8ea;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #8a8f98;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .video-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    border-radius: 16px;
    overflow: hidden;
    background: #1a1d24;
    aspect-ratio: 4/3;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .status {
    text-align: center;
    padding: 10px;
    font-size: 0.85rem;
    color: #8a8f98;
  }
  .controls {
    display: flex;
    gap: 10px;
    max-width: 480px;
    margin: 12px auto;
  }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  #startBtn { background: #4f7cff; color: white; }
  #switchBtn { background: #262a33; color: #e8e8ea; }
  button:disabled { opacity: 0.5; }
  .results {
    max-width: 480px;
    margin: 16px auto 0;
  }
  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1a1d24;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .label { font-size: 0.9rem; text-transform: capitalize; }
  .bar-wrap {
    flex: 1;
    height: 6px;
    background: #262a33;
    border-radius: 4px;
    margin: 0 12px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    background: #4f7cff;
    border-radius: 4px;
    transition: width 0.2s ease;
  }
  .pct { font-size: 0.85rem; color: #8a8f98; min-width: 42px; text-align: right; }
  .perf {
    text-align: center;
    color: #565b66;
    font-size: 0.75rem;
    margin-top: 16px;
  }
</style>
</head>
<body>

<h1>Clasificador en vivo (MobileNet + TF.js)</h1>
<div class="subtitle">Corriendo 100% en el navegador — sin servidor</div>

<div class="video-wrap">
  <video id="video" autoplay playsinline muted></video>
</div>

<div class="status" id="status">Cargando modelo MobileNet...</div>

<div class="controls">
  <button id="startBtn" disabled>Iniciar cámara</button>
  <button id="switchBtn" disabled>Cambiar cámara</button>
</div>

<div class="results" id="results"></div>
<div class="perf" id="perf"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>

<script>
let model = null;
let stream = null;
let running = false;
let facingMode = "environment";
let frameTimes = [];

const video = document.getElementById("video");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const switchBtn = document.getElementById("switchBtn");
const resultsEl = document.getElementById("results");
const perfEl = document.getElementById("perf");

async function loadModel() {
  try {
    // WebGL backend aprovecha la GPU del Snapdragon vía Adreno
    await tf.setBackend("webgl");
    await tf.ready();
    model = await mobilenet.load({ version: 2, alpha: 1.0 });
    statusEl.textContent = "Modelo cargado (backend: " + tf.getBackend() + "). Listo.";
    startBtn.disabled = false;
    switchBtn.disabled = false;
  } catch (err) {
    statusEl.textContent = "Error cargando el modelo: " + err.message;
  }
}

async function startCamera() {
  try {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    running = true;
    statusEl.textContent = "Clasificando en tiempo real...";
    predictLoop();
  } catch (err) {
    statusEl.textContent = "No se pudo acceder a la cámara: " + err.message;
  }
}

function switchCamera() {
  facingMode = facingMode === "environment" ? "user" : "environment";
  startCamera();
}

async function predictLoop() {
  if (!running || !model || video.readyState < 2) {
    requestAnimationFrame(predictLoop);
    return;
  }
  const t0 = performance.now();
  const predictions = await model.classify(video, 5);
  const t1 = performance.now();

  frameTimes.push(t1 - t0);
  if (frameTimes.length > 20) frameTimes.shift();
  const avgMs = frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length;
  perfEl.textContent = "Inferencia: " + avgMs.toFixed(0) + " ms/frame (~" + (1000 / avgMs).toFixed(1) + " fps)";

  renderResults(predictions);
  requestAnimationFrame(predictLoop);
}

function renderResults(predictions) {
  resultsEl.innerHTML = "";
  predictions.forEach(p => {
    const pct = (p.probability * 100).toFixed(1);
    const row = document.createElement("div");
    row.className = "result-row";
    row.innerHTML = `
      <div class="label" style="min-width:110px">${p.className.split(",")[0]}</div>
      <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
      <div class="pct">${pct}%</div>
    `;
    resultsEl.appendChild(row);
  });
}

startBtn.addEventListener("click", startCamera);
switchBtn.addEventListener("click", switchCamera);

loadModel();
</script>

</body>
</html>
